<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Chandy's</title>

        <link rel="stylesheet" href="./assets/css/bootstrap.css">
        <link rel="stylesheet" href="./assets/css/app.css">

        <link rel="shortcut icon" href="./assets/images/logo.png"
            type="image/x-icon">
    </head>
    <body>
        <div class="wrapper">
            <main>
                <div class="hero-banner autoHeight bannerSec">
                    <div>
                        <header data-include="header"></header>
                        <!-- <div class="hero-image-slider swiper">
                            <div class="swiper-wrapper align-items-center">
                                <div class="item swiper-slide">
                                    <img class="d-none d-sm-inline-block"
                                        src="./assets/images/banner1.jpg" alt>
                                    <img class="d-sm-none"
                                        src="./assets/images/DSC09330-HDR.jpg"
                                        alt>
                                </div>
                            </div>
                        </div> -->
                    </div>
                </div>

                <section class="section">
                    <div class="container">
                        <div class="text-center">
                            <h3 class="section-title mb-3">Online
                                Reservation</h3>
                        </div>
                    </div>
                </section>

                <section class="section pt-0">
                    <div class="container">
                        <div class="bookingBoxWrap">
                            <div class="text-end">
                                <div class="form-group dropdown">
                                    <button
                                        class="btn btn-primary btn-sm mb-5 dropdown-toggle fw-semibold"
                                        data-bs-toggle="dropdown">Manage
                                        Bookings <i
                                            class="fas fa-chevron-down"></i></button>
                                    <ul class="dropdown-menu autoWidth">
                                        <li>Modify Booking</li>
                                        <li>Cancel Booking</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="bookingBox">

                                <div class="row">
                                    <div class="col-lg-4">
                                        <div class="form-group dropdown">
                                            <label for>Select Property</label>
                                            <div
                                                class="input-group dropdown-toggle"
                                                data-bs-toggle="dropdown">
                                                <input value="Windy's Woods"
                                                    type="text"
                                                    class="form-control"
                                                    disabled>
                                                <div
                                                    class="input-group-text dropdown-toggle">
                                                    <i
                                                        class="fa fa-chevron-down"></i>
                                                </div>
                                                <ul class="dropdown-menu">
                                                    <li>Windy's Woods</li>
                                                    <li>Drizzle Drops</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-4">
                                        <div class="form-group">
                                            <label for>Check In</label>
                                            <div class="input-group">
                                                <input
                                                    class="datepicker form-control"
                                                    type="text" name id>
                                                <div class="input-group-text"><i
                                                        class="fas fa-calendar-alt"></i></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-4">
                                        <div class="form-group dropdown"
                                            data-bs-auto-close="outside">
                                            <label for>Room</label>
                                            <div
                                                class="input-group dropdown-toggle"
                                                data-bs-toggle="dropdown">
                                                <div
                                                    class="roomSelector form-control">1
                                                    Room, 1 Adult, 0
                                                    Children</div>
                                                <div class="input-group-text"><i
                                                        class="fa fa-plus"></i></div>
                                            </div>
                                            <ul class="dropdown-menu">
                                                <li class="roomsSelectOptions">
                                                    <div class="item mb-3">
                                                        <div>Rooms</div>
                                                        <div class="counter">
                                                            <button
                                                                class="btn counterIconBtn"><i
                                                                    class="fas fa-minus"></i></button>
                                                            <span>1</span>
                                                            <button
                                                                class="btn counterIconBtn"><i
                                                                    class="fas fa-plus"></i></button>
                                                        </div>
                                                    </div>
                                                    <div class="item mb-3">
                                                        <div>Adults</div>
                                                        <div class="counter">
                                                            <button
                                                                class="btn counterIconBtn"><i
                                                                    class="fas fa-minus"></i></button>
                                                            <span>1</span>
                                                            <button
                                                                class="btn counterIconBtn"><i
                                                                    class="fas fa-plus"></i></button>
                                                        </div>
                                                    </div>
                                                    <div class="item">
                                                        <div>Children</div>
                                                        <div class="counter">
                                                            <button
                                                                class="btn counterIconBtn"><i
                                                                    class="fas fa-minus"></i></button>
                                                            <span>1</span>
                                                            <button
                                                                class="btn counterIconBtn"><i
                                                                    class="fas fa-plus"></i></button>
                                                        </div>
                                                    </div>
                                                    <button
                                                        class="btn btn-primary btn-sm mt-3 w-100 d-block">Apply</button>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-end mt-4">
                                    <button
                                        class="btn btn-sm btn-outline-dark">Search</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="section book-now-bottom-section">
                    <div class="container">
                        <div class="book-now-bottom-wrap">
                            <div class="row align-items-center">
                                <div class="col-lg-8 mb-3 mb-lg-0">
                                    <div class="text-center">
                                        <h2
                                            class="section-title fw-semibold mb-2">Where
                                            will you go next?</h2>
                                        <p class="fs20">You are spoiled of
                                            choice with our unique
                                            destinations,<br>our hotel and
                                            resorts</p>
                                        <button class="btn btn-primary">Book
                                            Now</button>
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <img src="./assets/images/banner3.jpg" alt
                                        class="img-fluid">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
            <footer data-include="footer"></footer>
        </div>

        <script src="./assets/js/jquery.js"></script>
        <script src="./assets/js/bootstrap.bundle.min.js"></script>
        <script src="./assets/js/plugins.js"></script>
        <script src="./assets/js/app.js"></script>
    </body>
</html>
